name: Affirmed Networks
description: 'Affirmed Networks is a cloud-native mobile core networking company, acquired
  by Microsoft in 2020 and now operating as part of the Azure for Operators initiative. It builds
  virtualized, fully software-based mobile network functions for telecommunications operators,
  including a Virtual Evolved Packet Core (vEPC), the Affirmed UnityCloud 5G Core, private network
  services, network slicing, and analytics. Its packet-core technology underpins Microsoft''s Azure
  Operator Nexus and Azure Operator 5G Core platforms. Affirmed serves carriers and service providers
  modernizing their networks and does not expose a public developer API or SDK surface.'
